<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Cover — AI Test Case Generation That Actually Understands Your Context</title>
<link href="https://api.fontshare.com/v2/css?f[]=montserrat@900,700,500,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:628px; overflow:hidden; font-family:'Montserrat',-apple-system,sans-serif; }
.canvas { width:1200px; height:628px; position:relative; background:#004E64; overflow:hidden; }
.bg { position:absolute; inset:0; background:radial-gradient(ellipse at 80% 110%, #002d3d 0%, #004E64 50%, #003a52 100%); }
.accent-bar { position:absolute; top:0; left:0; width:8px; height:100%; background:#FF6B35; }
.dot-grid { position:absolute; inset:0; background-image:radial-gradient(circle,rgba(255,255,255,0.04) 1px,transparent 1px); background-size:36px 36px; }
.right-panel { position:absolute; right:0; top:0; width:280px; height:100%; background:rgba(0,0,0,0.2); border-left:1px solid rgba(255,107,53,0.2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; }
.stat-block { text-align:center; }
.stat-num { font-size:48px; font-weight:900; color:#FF6B35; line-height:1; }
.stat-label { font-size:11px; font-weight:600; color:rgba(255,255,255,0.5); letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
.divider { width:40px; height:1px; background:rgba(255,107,53,0.3); }
.left-zone { position:absolute; top:0; left:0; width:920px; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:44px 56px 44px 72px; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:32px; height:32px; background:#FF6B35; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.logo-text { font-size:16px; font-weight:700; color:#ffffff; letter-spacing:-0.2px; }
.headline-block { flex:1; display:flex; flex-direction:column; justify-content:center; }
.eyebrow { font-size:12px; font-weight:700; color:#FF6B35; letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; }
.headline { font-size:58px; font-weight:900; color:#ffffff; letter-spacing:-2px; line-height:1.05; max-width:780px; }
.accent-line { width:56px; height:3px; background:#FF6B35; margin:20px 0; border-radius:2px; }
.subhead { font-size:18px; font-weight:400; color:rgba(255,255,255,0.65); max-width:620px; line-height:1.5; }
.bottom { display:flex; align-items:center; gap:16px; }
.pill { background:#FF6B35; color:#fff; font-size:12px; font-weight:700; padding:7px 18px; border-radius:100px; letter-spacing:0.5px; }
.badge { border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.4); font-size:11px; font-weight:500; padding:6px 14px; border-radius:100px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"></div>
  <div class="dot-grid"></div>
  <div class="accent-bar"></div>
  <div class="right-panel">
    <div class="stat-block"><div class="stat-num">$10</div><div class="stat-label">per user/month</div></div>
    <div class="divider"></div>
    <div class="stat-block"><div class="stat-num">QA</div><div class="stat-label">Leader Series</div></div>
    <div class="divider"></div>
    <div class="stat-block"><div class="stat-num">2026</div><div class="stat-label">Guide</div></div>
  </div>
  <div class="left-zone">
    <div class="logo">
      <div class="logo-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M3 9h8M3 13h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
      <span class="logo-text">TestFiesta</span>
    </div>
    <div class="headline-block">
      <div class="eyebrow">The QA Leader's Guide</div>
      <div class="headline">AI Test Case Generation That Actually Understands Your Context</div>
      <div class="accent-line"></div>
      <div class="subhead">Modern test management for teams that ship fast.</div>
    </div>
    <div class="bottom">
      <span class="pill">testfiesta.com</span>
      <span class="badge">Start Free Account</span>
    </div>
  </div>
</div>
</body>
</html>
